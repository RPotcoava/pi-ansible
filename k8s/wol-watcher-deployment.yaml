apiVersion: v1
kind: ConfigMap
metadata:
  name: wol-watcher-script
  namespace: dms
data:
  watcher.py: |
    import os
    import time
    import socket
    import struct
    import subprocess

    TRUENAS_IP = os.getenv("TRUENAS_IP", "192.168.0.15")
    TRUENAS_MAC = os.getenv("TRUENAS_MAC", "AA:BB:CC:DD:EE:FF")
    REDIS_HOST = os.getenv("REDIS_HOST", "redis-service")
    REDIS_PORT = int(os.getenv("REDIS_PORT", "6379"))
    CONSUME_DIR = os.getenv("CONSUME_DIR", "/paperless-consume")
    CHECK_INTERVAL = int(os.getenv("CHECK_INTERVAL", "60"))

    def is_truenas_online(ip):
        try:
            output = subprocess.run(
                ["ping", "-c", "1", "-W", "1", ip],
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL
            )
            return output.returncode == 0
        except Exception as e:
            print(f"Error pinging {ip}: {e}")
            return False

    def send_wol(mac_address):
        print(f"Sending Wake-on-LAN magic packet to {mac_address}...")
        try:
            clean_mac = mac_address.replace(":", "").replace("-", "")
            if len(clean_mac) != 12:
                raise ValueError("MAC address must be 12 hexadecimal characters")
            mac_bytes = bytes.fromhex(clean_mac)
            payload = b'\xff' * 6 + mac_bytes * 16
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                s.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
                s.sendto(payload, ("255.255.255.255", 9))
            print("WoL magic packet sent successfully.")
        except Exception as e:
            print(f"Failed to send WoL packet: {e}")

    def check_paperless_consume(directory):
        if not os.path.exists(directory):
            return False
        try:
            files = [f for f in os.listdir(directory) if not f.startswith(".")]
            if files:
                print(f"Paperless consume folder contains {len(files)} files: {files}")
                return True
        except Exception as e:
            print(f"Error reading directory {directory}: {e}")
        return False

    def check_redis_queues(host, port):
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(5)
            s.connect((host, port))
            # Redis protocol request for BullMQ keys
            s.sendall(b"*2\r\n$4\r\nKEYS\r\n$6\r\nbull:*\r\n")
            response = s.recv(4096)
            s.close()
            if b"wait" in response or b"active" in response:
                print("Detected active or waiting jobs in Redis.")
                return True
        except Exception as e:
            pass # Redis might be empty or starting
        return False

    def main():
        print("DMS Wake-on-LAN Watcher started.")
        print(f"Monitoring: {CONSUME_DIR} and Redis ({REDIS_HOST}:{REDIS_PORT})")
        print(f"TrueNAS Target: {TRUENAS_IP} (MAC: {TRUENAS_MAC})")
        while True:
            try:
                tasks_pending = False
                if check_paperless_consume(CONSUME_DIR):
                    tasks_pending = True
                if not tasks_pending and check_redis_queues(REDIS_HOST, REDIS_PORT):
                    tasks_pending = True
                if tasks_pending:
                    if not is_truenas_online(TRUENAS_IP):
                        send_wol(TRUENAS_MAC)
                time.sleep(CHECK_INTERVAL)
            except Exception as e:
                print(f"Error in watcher loop: {e}")
                time.sleep(CHECK_INTERVAL)

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wol-watcher
  namespace: dms
  labels:
    app: wol-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wol-watcher
  template:
    metadata:
      labels:
        app: wol-watcher
    spec:
      containers:
        - name: watcher
          image: python:3.11-alpine
          command: ["python", "-u", "/app/watcher.py"]
          env:
            - name: TRUENAS_IP
              value: "192.168.0.15"
            - name: TRUENAS_MAC
              value: "AA:BB:CC:DD:EE:FF" # REPLACE with actual TrueNAS MAC address
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: CONSUME_DIR
              value: "/paperless-consume"
            - name: CHECK_INTERVAL
              value: "60"
          volumeMounts:
            - name: script-vol
              mountPath: /app/watcher.py
              subPath: watcher.py
            - name: paperless-consume-vol
              mountPath: /paperless-consume
              readOnly: true
      volumes:
        - name: script-vol
          configMap:
            name: wol-watcher-script
        - name: paperless-consume-vol
          persistentVolumeClaim:
            claimName: paperless-pvc # Mounts the same NFS PVC so we can monitor incoming scans
