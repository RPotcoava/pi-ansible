# Kubernetes Security Scanners Configuration
# Trivy Container Vulnerability Importer & IoT Network Scanner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-scan-script
  namespace: security
  labels:
    app: iot-nmap-scan
data:
  iot_scan_and_report.py: |
    #!/usr/bin/env python3
    """
    iot_scan_and_report.py - Polite IoT vulnerability and port scanner.
    Scans home IoT devices and forwards findings to Wazuh via Syslog UDP 514.
    """
    import subprocess
    import xml.etree.ElementTree as ET
    import json
    import os
    import sys
    import socket
    import time
    from datetime import datetime, timezone

    WAZUH_SYSLOG_HOST = os.environ.get("WAZUH_SYSLOG_HOST", "wazuh-manager-lb.security.svc.cluster.local")
    WAZUH_SYSLOG_PORT = int(os.environ.get("WAZUH_SYSLOG_PORT", "514"))
    TARGETS = os.environ.get("TARGETS", "192.168.0.0/24")
    EXCLUDE_TARGETS = os.environ.get("EXCLUDE_TARGETS", "192.168.0.145")  # Exclude honeypot by default
    PORTS = os.environ.get("PORTS", "21,22,23,80,443,554,5555,8080,8443,8888,8008")

    # Syslog PRI = facility local1 (17) * 8 + notice (5) = 141
    SYSLOG_PRI = "<141>"

    def syslog_send(sock, host, port, message):
        now = datetime.now(timezone.utc).strftime("%b %d %H:%M:%S")
        syslog_msg = f"{SYSLOG_PRI}{now} iot-scan: {message}".encode("utf-8")
        sock.sendto(syslog_msg, (host, port))

    def main():
        print(f"[INFO] Starting IoT scan at {datetime.now(timezone.utc).isoformat()}")
        print(f"[INFO] Targets: {TARGETS}")
        print(f"[INFO] Ports: {PORTS}")

        xml_output = "/tmp/iot-scan.xml"
        if os.path.exists(xml_output):
            try: os.remove(xml_output)
            except: pass

        cmd = [
            "nmap",
            "-sV",
            "--version-intensity", "2",
            "-p", PORTS,
            "--open",
            "-T3",
            "--max-rtt-timeout", "300ms",
            "--max-retries", "2",
            "--host-timeout", "60s",
            "-oX", xml_output,
        ]

        if EXCLUDE_TARGETS:
            cmd.extend(["--exclude", EXCLUDE_TARGETS])

        cmd.extend(TARGETS.split())

        print(f"[INFO] Running nmap command: {' '.join(cmd)}")
        res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
        if res.returncode != 0:
            print(f"[WARN] Nmap finished with returncode {res.returncode}: {res.stderr}")

        if not os.path.exists(xml_output):
            print("[ERROR] XML output not generated by nmap", file=sys.stderr)
            sys.exit(1)

        try:
            tree = ET.parse(xml_output)
            root = tree.getroot()
        except Exception as e:
            print(f"[ERROR] Failed to parse nmap XML: {e}", file=sys.stderr)
            sys.exit(1)

        scan_ts = datetime.now(timezone.utc).isoformat()
        findings = []

        for host in root.findall("host"):
            addr = host.find('address[@addrtype="ipv4"]')
            if addr is None:
                continue
            ip = addr.get("addr")

            hostnames = host.find("hostnames")
            hostname = ""
            if hostnames is not None:
                hn = hostnames.find("hostname")
                if hn is not None:
                    hostname = hn.get("name", "")

            ports_el = host.find("ports")
            if ports_el is None:
                continue

            for port in ports_el.findall("port"):
                state = port.find("state")
                if state is None or state.get("state") != "open":
                    continue

                port_id = port.get("portid")
                protocol = port.get("protocol", "tcp")

                svc = port.find("service")
                svc_name = svc.get("name", "") if svc is not None else "unknown"
                product = svc.get("product", "") if svc is not None else ""
                version = svc.get("version", "") if svc is not None else ""

                if port_id in ["21", "23", "5555"]:
                    severity = "HIGH"
                    title = f"Insecure cleartext/management service {svc_name} on {ip}:{port_id}"
                elif port_id in ["80", "8080", "8008"]:
                    severity = "LOW"
                    title = f"Web interface {svc_name} on {ip}:{port_id}"
                elif port_id == "554":
                    severity = "LOW"
                    title = f"RTSP video stream {svc_name} on {ip}:{port_id}"
                else:
                    severity = "LOW"
                    title = f"Open service {svc_name} on {ip}:{port_id}"

                finding = {
                    "integration": "iot-scan",
                    "host": ip,
                    "hostname": hostname,
                    "open_port": port_id,
                    "protocol": protocol,
                    "service": svc_name,
                    "product": product,
                    "version": version,
                    "severity": severity,
                    "title": title,
                    "scan_time": scan_ts
                }
                findings.append(finding)

        print(f"[INFO] Discovered {len(findings)} open services across IoT devices")

        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sent = 0
        for finding in findings:
            try:
                msg_json = json.dumps(finding)
                syslog_send(sock, WAZUH_SYSLOG_HOST, WAZUH_SYSLOG_PORT, msg_json)
                sent += 1
                time.sleep(0.05)
            except Exception as e:
                print(f"[WARN] Failed to send finding: {e}", file=sys.stderr)

        sock.close()
        print(f"[INFO] Done. Forwarded {sent}/{len(findings)} findings to Wazuh Syslog ({WAZUH_SYSLOG_HOST}:{WAZUH_SYSLOG_PORT}).")

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iot-nmap-scan
  namespace: security
  labels:
    app: iot-nmap-scan
    component: security-scan
spec:
  schedule: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: iot-nmap-scan
        spec:
          restartPolicy: OnFailure
          containers:
          - name: iot-scan
            image: python:3.12-alpine
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - "apk add --no-cache nmap nmap-scripts >/dev/null 2>&1 && python3 /scripts/iot_scan_and_report.py"
            env:
            - name: WAZUH_SYSLOG_HOST
              value: "wazuh-manager-lb.security.svc.cluster.local"
            - name: WAZUH_SYSLOG_PORT
              value: "514"
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
            - name: script-vol
              mountPath: /scripts
          volumes:
          - name: script-vol
            configMap:
              name: iot-scan-script
              defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-wazuh-importer
  namespace: security
  labels:
    app: trivy-wazuh-importer
spec:
  schedule: "0 6 * * 0"  # Every Sunday at 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: trivy-wazuh-importer
          containers:
          - name: trivy-wazuh
            image: python:3.12-alpine
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - /scripts/trivy-to-wazuh.py
            env:
            - name: WAZUH_SYSLOG_HOST
              value: "wazuh-manager-lb.security.svc.cluster.local"
            - name: WAZUH_SYSLOG_PORT
              value: "514"
            - name: MIN_SEVERITY
              value: "HIGH"
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: scripts
            configMap:
              name: trivy-wazuh-script
              defaultMode: 493
