# /mnt/SSD/scripts/openvas/openvas_scan.conf
# Configuration for OpenVAS Automated Boot Scanner

# Target subnet or IP list (comma-separated)
TARGET_NAME="Home Network (192.168.0.0/24)"
TARGET_HOSTS="192.168.0.0/24"
TASK_NAME="Automated Boot Vulnerability Scan"

# Greenbone Scan Config & Scanner IDs
SCAN_CONFIG_ID="daba56c8-73ec-11df-a475-002264764cea"  # Full and fast
SCANNER_ID="08b69003-5fc2-4037-a479-93b440211c73"      # OpenVAS Default
PORT_LIST_ID="33d0cd82-57c6-11e1-8ed1-406186ea4fc5"    # All IANA TCP

# Wazuh Integration
WAZUH_SYSLOG_HOST="192.168.0.248"
WAZUH_SYSLOG_PORT="514"
REPORT_OUTPUT_FILE="/var/log/openvas_report.json"
MIN_SEVERITY="LOW"  # Alert on LOW, MEDIUM, HIGH, CRITICAL

# Power Management
AUTO_SHUTDOWN="true"
SHUTDOWN_GRACE_SECONDS="60"
CANCEL_FILE="/tmp/cancel_shutdown"
DISABLE_SCAN_FILE="/tmp/disable_openvas_scan"
